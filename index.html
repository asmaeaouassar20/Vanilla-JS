<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CRUDS</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="elmMode">        
        <div class="crud">
            <div class="head">
                <h2>crud</h2>
                <p>PRODUCT MANAGEMENT SYSTEM</p>
                <button onclick="switchLightDarkMode()">switch to <span id="modeDisplay"></span></button>
            </div>

            <div class="inputs">
                <input placeholder="title" type="text" id="title" />
                <div class="price">
                    <input onkeyup="getTotal()" type="number" id="price" placeholder="price">
                    <input onkeyup="getTotal()" type="number" id="taxes" placeholder="taxes">
                    <input onkeyup="getTotal()" type="number" id="ads" placeholder="ads">
                    <input onkeyup="getTotal()" type="number" id="discount" placeholder="discount">
                    <small id="total" class="elmMode"></small>
                </div>
                <input type="number" id="count" placeholder="count">
                <input type="text" id="category" placeholder="category">
                <button id="submit">Create</button>
            </div>

            <div class="outputs">
                <div class="searchBlock">
                    <input type="text" onkeyup="searchInProducts(this.value)" id="search" >
                    <div class="btnSearch">
                        <button onclick="changeSearchBy('title')" id="searchByTitle">search By Title</button>
                        <button onclick="changeSearchBy('category')" id="searchByCategory">search By Category</button>
                    </div>
                </div>
                <button id="deleteAllSection" onclick="deleteAll()">delete all <span id="totalProducts"></span></button>
                <table>
                    <thead>
                        <tr>
                            <th>id</th>
                            <th>title</th>
                            <th>price</th>
                            <th>taxes</th>
                            <th>ads</th>
                            <th>discount</th>
                            <th>total</th>
                            <th>category</th>
                            <th>update</th>
                            <th>delete</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                      
                    </tbody>
                </table>
            </div>
        </div>

        <script src="main.js"></script>
    </body>
</html>
